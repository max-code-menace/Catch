:root {
  --bg: #ECEEF2; --panel: #FFFFFF; --fg: #14171C; --mute: #555D6B; --line: #D3D8E0; --chip: #DFE3EA;
  --accent: #2447D6; --accent-fg: #FFFFFF; --shadow: 0 10px 30px rgba(20, 23, 28, .16);

@media (prefers-color-scheme: dark) {

}
:root[data-theme="dark"] { --bg: #111318; --panel: #1B1E25; --fg: #F1F3F6; --mute: #A6AEBB; --line: #2F343E; --chip: #272B34; --accent: #9DB2FF; --accent-fg: #0F1320; --shadow: 0 10px 30px rgba(0, 0, 0, .5); color-scheme: dark; }

body { background: var(--bg); color: var(--fg); font-family: var(--text); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 28px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.head h1 { margin: 0; font-family: var(--display); font-size: clamp(26px, 4vw, 36px); font-weight: 700; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.head p { margin: 8px 0 0; color: var(--mute); max-width: 62ch; }

.ui { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; box-sizing: border-box; }
.ui:focus-visible, .zoom:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.controls { display: flex; flex-direction: column; gap: 12px; }
.seg { display: inline-flex; align-self: flex-start; padding: 4px; border-radius: 12px; background: var(--chip); gap: 4px; }
.seg .ui { min-height: 40px; padding: 0 16px; border-radius: 9px; font-weight: 600; color: var(--mute); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs .ui { min-height: 44px; padding: 0 14px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; display: flex; align-items: center; gap: 8px; }
.tabs .ui b { font-family: var(--display); font-weight: 700; }
.tabs .ui[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

.pitch { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.pitch h2 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
.pitch p { margin: 2px 0 0; color: var(--mute); max-width: 70ch; }
.pitch .txt { min-width: 0; flex: 1 1 320px; }
.nav { display: flex; gap: 6px; }
.nav .ui { min-height: 44px; padding: 0 16px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); font-weight: 600; }

.grid { display: grid; gap: 24px 20px; }
.grid.dir { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); max-width: 1000px; }
.grid.screen { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.phone { margin: 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.frame { position: relative; aspect-ratio: 390 / 844; max-width: 100%; border-radius: 22px; overflow: hidden; background: var(--panel); box-shadow: var(--shadow); outline: 1px solid var(--line); }
.mock { position: absolute; top: 0; left: 0; width: 390px; height: 844px; transform-origin: 0 0; transform: scale(var(--s, .5)); font-size: 16px; line-height: normal; text-align: left; pointer-events: none; }
.mock button { font: inherit; border: 0; }
.zoom { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: none; cursor: zoom-in; border-radius: 22px; }
.cap { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cap span { font-weight: 600; min-width: 0; }
.cap span b { font-family: var(--display); }
.pick { min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--panel); font-weight: 600; white-space: nowrap; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--panel); border-top: 1px solid var(--line); padding-top: 12px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.bar-in { max-width: 1240px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.bar strong { font-family: var(--display); }
.slots { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 260px; min-width: 0; }
.slot { padding: 6px 10px; border-radius: 8px; background: var(--chip); font-size: 13px; font-weight: 600; }
.slot.empty { color: var(--mute); font-weight: 500; }
.copy { min-height: 44px; padding: 0 18px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.copy:disabled { opacity: .45; cursor: default; }
#choice-text { position: absolute; left: -9999px; }

dialog { border: 0; padding: 16px; border-radius: 26px; background: var(--panel); color: var(--fg); box-shadow: var(--shadow); max-width: calc(100vw - 16px); box-sizing: border-box; }
dialog::backdrop { background: rgba(10, 12, 16, .6); }
.dlg-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.dlg-head h2 { margin: 0; font-family: var(--display); font-size: 18px; }
.dlg-head .ui { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; }
.dlg-frame { width: min(390px, calc(100vw - 48px), calc((100vh - 190px) * .462)); }
.dlg-foot { display: flex; justify-content: center; margin-top: 12px; }
</style>

<script>
(() => {
  const DIRS = [
    { id: 'A', name: 'Stade', pitch: 'Sportif classique, orange vif. Carte avec panneau du bas, pile de cartes à swiper.' },
    { id: 'B', name: 'Nuit', pitch: 'Sombre et vert fluo. Le compte à rebours avant le début est l’information principale.' },
    { id: 'C', name: 'Brut', pitch: 'Noir, blanc, jaune, bordures épaisses. Épingles numérotées, boutons NON et OUI.' },
    { id: 'D', name: 'Calme', pitch: 'Blanc, un seul bleu, très sobre. Bascule carte ou liste, fiche présentée en lignes.' },
    { id: 'E', name: 'Club', pitch: 'Vert de club de sport et tableau d’affichage. Le swipe est un billet de match.' },
    { id: 'F', name: 'Bulle', pitch: 'Rond, pastel, joueur. Les sports sont des bulles, les places libres des ronds vides.' },
    { id: 'G', name: 'Papier', pitch: 'Un journal : l’agenda du jour passe avant la carte, chaque partie est un titre d’article.' },
    { id: 'H', name: 'Glace', pitch: 'La carte reste toujours visible derrière des panneaux translucides, même pendant le swipe.' },
    { id: 'I', name: 'Tableau', pitch: 'Utilitaire et dense, façon appli de transport. Liste par heure, statut de chaque joueur.' },
    { id: 'J', name: 'Soleil', pitch: 'Une couleur par sport, de très gros chiffres, des aplats francs.' },
  ];
  const SCREENS = [
    { id: 'Carte', label: 'Carte', pitch: 'Où se joue quoi autour de moi, et comment proposer une partie.' },
    { id: 'Swipe', label: 'Swipe', pitch: 'Une partie à la fois : j’y vais ou je passe.' },
    { id: 'Partie', label: 'Partie et chat', pitch: 'La partie que j’ai rejointe : qui vient, à quelle heure, et la discussion du groupe.' },
  ];
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const dirOf = id => DIRS.find(d => d.id === id), screenOf = id => SCREENS.find(s => s.id === id);

  let saved = {};
  try { saved = JSON.parse(localStorage.getItem('partant-galerie') || '{}') || {}; } catch (e) { saved = {}; }
  const state = { mode: saved.mode === 'screen' ? 'screen' : 'dir', dir: dirOf(saved.dir) ? saved.dir : 'A', screen: screenOf(saved.screen) ? saved.screen : 'Carte', pick: {} };
  for (const s of SCREENS) state.pick[s.id] = saved.pick && dirOf(saved.pick[s.id]) ? saved.pick[s.id] : null;
  const persist = () => { try { localStorage.setItem('partant-galerie', JSON.stringify(state)); } catch (e) { /* stockage indisponible */ } };

  const sizer = new ResizeObserver(entries => { for (const en of entries) en.target.style.setProperty('--s', en.contentRect.width / 390); });
  function fill(frame, d, s) {
    const mock = el('div', 'mock');
    mock.inert = true; mock.setAttribute('aria-hidden', 'true');
    mock.append($(`t-${d.id}-${s.id}`).content.cloneNode(true));
    frame.replaceChildren(mock);
    sizer.observe(frame);
  }
  function pickButton(btn, d, s, long) {
    const on = state.pick[s.id] === d.id;
    btn.setAttribute('aria-pressed', String(on));
    btn.textContent = on ? (long ? `Choisi pour « ${s.label} »` : 'Choisi') : (long ? `Choisir pour « ${s.label} »` : 'Choisir');
    btn.onclick = () => { state.pick[s.id] = on ? null : d.id; persist(); render(); if ($('dlg').open) pickButton($('dlg-pick'), d, s, true); };
  }
  function phone(d, s, caption) {
    const fig = el('figure', 'phone'), frame = el('div', 'frame');
    fill(frame, d, s);
    const zoom = el('button', 'zoom');
    zoom.type = 'button'; zoom.setAttribute('aria-label', `Agrandir : ${d.id} ${d.name}, ${s.label}`);
    zoom.onclick = () => openZoom(d, s);
    frame.append(zoom);
    const cap = el('figcaption', 'cap'), name = el('span');
    name.append(el('b', null, caption.lead), ' ' + caption.rest);
    const pick = el('button', 'ui pick'); pick.type = 'button';
    pickButton(pick, d, s, false);
    cap.append(name, pick);
    fig.append(frame, cap);
    return fig;
  }
  function openZoom(d, s) {
    $('dlg-title').textContent = `${d.id} · ${d.name} — ${s.label}`;
    fill($('dlg-frame'), d, s);
    pickButton($('dlg-pick'), d, s, true);
    $('dlg').showModal();
  }
  $('dlg-close').onclick = () => $('dlg').close();
  $('dlg').addEventListener('click', e => { if (e.target === $('dlg')) $('dlg').close(); });

  function tab(label, lead, on, go) {
    const b = el('button', 'ui'); b.type = 'button'; b.setAttribute('aria-pressed', String(on));
    if (lead) b.append(el('b', null, lead));
    b.append(label); b.onclick = go;
    return b;
  }
  function render() {
    const byDir = state.mode === 'dir';
    $('mode-dir').setAttribute('aria-pressed', String(byDir));
    $('mode-screen').setAttribute('aria-pressed', String(!byDir));
    const pitch = $('pitch'), grid = $('grid'), txt = el('div', 'txt');
    grid.className = 'grid ' + (byDir ? 'dir' : 'screen');
    if (byDir) {
      const d = dirOf(state.dir), i = DIRS.indexOf(d);
      $('tabs').replaceChildren(...DIRS.map(x => tab(x.name, x.id, x.id === d.id, () => { state.dir = x.id; persist(); render(); })));
      txt.append(el('h2', null, `${d.id} · ${d.name}`), el('p', null, d.pitch));
      const nav = el('div', 'nav');
      const prev = el('button', 'ui', '← Précédente'), next = el('button', 'ui', 'Suivante →');
      prev.type = next.type = 'button';
      prev.onclick = () => { state.dir = DIRS[(i + DIRS.length - 1) % DIRS.length].id; persist(); render(); };
      next.onclick = () => { state.dir = DIRS[(i + 1) % DIRS.length].id; persist(); render(); };
      nav.append(prev, next);
      pitch.replaceChildren(txt, nav);
      grid.replaceChildren(...SCREENS.map(s => phone(d, s, { lead: s.label, rest: '' })));
    } else {
      const s = screenOf(state.screen);
      $('tabs').replaceChildren(...SCREENS.map(x => tab(x.label, null, x.id === s.id, () => { state.screen = x.id; persist(); render(); })));
      txt.append(el('h2', null, s.label), el('p', null, s.pitch + ' Les dix directions, côte à côte.'));
      pitch.replaceChildren(txt);
      grid.replaceChildren(...DIRS.map(d => phone(d, s, { lead: d.id, rest: d.name })));
    }
    const parts = SCREENS.map(s => ({ s, d: dirOf(state.pick[s.id]) }));
    $('slots').replaceChildren(...parts.map(({ s, d }) => el('span', 'slot' + (d ? '' : ' empty'), d ? `${s.label} : ${d.id} · ${d.name}` : `${s.label} : à choisir`)));
    const chosen = parts.filter(p => p.d);
    $('choice-text').value = chosen.length ? 'Mon choix Partant — ' + chosen.map(({ s, d }) => `${s.label} : ${d.id} (${d.name})`).join(', ') : '';
    $('copy').disabled = !chosen.length;
  }
  $('mode-dir').onclick = () => { state.mode = 'dir'; persist(); render(); };
  $('mode-screen').onclick = () => { state.mode = 'screen'; persist(); render(); };
  $('copy').onclick = async () => {
    const input = $('choice-text'), btn = $('copy');
    let ok = false;
    try { await navigator.clipboard.writeText(input.value); ok = true; } catch (e) { input.style.position = 'static'; input.style.flex = '1 1 100%'; input.select(); }
    btn.textContent = ok ? 'Copié' : 'Sélectionné : copie-le';
    setTimeout(() => { btn.textContent = 'Copier mon choix'; }, 2200);
  };
  render();
})();
</script>

</body></html>
