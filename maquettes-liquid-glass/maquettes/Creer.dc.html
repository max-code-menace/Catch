<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Allez — Créer une session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1F1B16}a:hover{color:#000000}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #FBF8F3; font-family: Inter, system-ui, sans-serif; color: #1F1B16">

  <div style="padding: 24px 16px 0; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700">Créer une session</h1>
      <span style="font-size: 14px; color: #6B6560">Étape 1 sur 3 · Quoi ?</span>
      <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <span style="height: 6px; border-radius: 3px; background: {{accent}}"></span>
        <span style="height: 6px; border-radius: 3px; background: #E7E2DA"></span>
        <span style="height: 6px; border-radius: 3px; background: #E7E2DA"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Quel sport ?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{sports}}" as="s" hint-placeholder-count="9">
          <button type="button" onClick="{{s.pick}}" style="{{s.style}} height: 52px; border-radius: 14px; font: 600 15px Inter, sans-serif">{{s.name}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Quel niveau ?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{levels}}" as="l" hint-placeholder-count="3">
          <button type="button" onClick="{{l.pick}}" style="{{l.style}} height: 48px; border-radius: 14px; font: 600 14px Inter, sans-serif">{{l.name}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Combien de personnes en tout ?</h2>
      <div style="display: flex; align-items: center; justify-content: space-between; padding: 8px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E7E2DA">
        <button type="button" aria-label="Une place de moins" onClick="{{minus}}" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #E7E2DA; background: #FBF8F3; font: 700 22px Inter, sans-serif; color: #1F1B16">−</button>
        <span style="font-family: 'Space Grotesk', Inter, sans-serif; font-size: 28px; font-weight: 700">{{places}}</span>
        <button type="button" aria-label="Une place de plus" onClick="{{plus}}" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #E7E2DA; background: #FBF8F3; font: 700 22px Inter, sans-serif; color: #1F1B16">+</button>
      </div>
      <span style="font-size: 13px; color: #6B6560">Toi compris. Tu pourras inviter tes potes avec un lien.</span>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 100px">
    <button type="button" style="width: 100%; height: 54px; border-radius: 16px; border: none; background: {{accent}}; color: #FFFFFF; font: 700 17px Inter, sans-serif">Suivant : où et quand</button>
  </div>

  <nav aria-label="Navigation principale" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; background: #FFFFFF; border-top: 1px solid #E7E2DA; display: flex; justify-content: space-around; align-items: flex-start; padding-top: 8px; box-sizing: border-box">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; min-height: 44px; text-decoration: none; font-size: 11px; font-weight: 600; color: #6B6560">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"></path><path d="M9 4v14M15 6v14"></path></svg>Carte</a>
    <a href="Chat.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; min-height: 44px; text-decoration: none; font-size: 11px; font-weight: 600; color: #6B6560">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>Mes sessions</a>
    <a href="Creer.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; min-height: 44px; text-decoration: none; font-size: 11px; font-weight: 700; color: {{accent}}">
      <span style="width: 44px; height: 44px; margin-top: -14px; border-radius: 22px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(31,27,22,0.2)"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></span>Créer</a>
    <a href="Chat.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; min-height: 44px; text-decoration: none; font-size: 11px; font-weight: 600; color: #6B6560">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"></path></svg>Messages</a>
    <a href="Profil.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 60px; min-height: 44px; text-decoration: none; font-size: 11px; font-weight: 600; color: #6B6560">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profil</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C2410C","options":["#C2410C","#237032","#1D4ED8"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#C2410C';
    const st = this.state || {};
    const sport = st.sport ?? 'Spikeball';
    const level = st.level ?? 'Tous niveaux';
    const places = st.places ?? 6;
    const on = 'background: ' + accent + '; color: #FFFFFF; border: 1px solid ' + accent + ';';
    const off = 'background: #FFFFFF; color: #1F1B16; border: 1px solid #E7E2DA;';
    const sports = ['Foot', 'Spikeball', 'Basket', 'Course', 'Pétanque', 'Volley', 'Padel', 'Frisbee', 'Autre'].map((name) => ({
      name,
      style: name === sport ? on : off,
      pick: () => this.setState({ sport: name })
    }));
    const levels = ['Débutant', 'Tous niveaux', 'Confirmé'].map((name) => ({
      name,
      style: name === level ? on : off,
      pick: () => this.setState({ level: name })
    }));
    return {
      accent,
      sports,
      levels,
      places,
      minus: () => this.setState({ places: Math.max(2, places - 1) }),
      plus: () => this.setState({ places: Math.min(30, places + 1) })
    };
  }
}
</script>
</body>
</html>
