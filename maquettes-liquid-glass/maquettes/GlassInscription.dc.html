<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Catch — Inscription</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #DDE3E6; font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #1C1C1E">

  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="844" fill="#DDE3E6"></rect>
    <path d="M-10 40 L120 10 L152 98 L44 124 L-10 116 Z" fill="#B9D3A8"></path>
    <path d="M236 60 L372 36 L400 184 L262 216 Z" fill="#B9D3A8"></path>
    <path d="M150 120 q32 -22 52 10 q20 42 -12 72 q-40 20 -50 -22 q-10 -40 10 -60 Z" fill="#9CC6E0"></path>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M60 -10 L84 250 M290 -10 L300 200 M-10 60 L200 46 L400 30" stroke-width="5"></path>
      <path d="M-10 170 L400 110 M200 -10 L230 300" stroke-width="14"></path>
    </g>
  </svg>

  <div style="position: absolute; left: 24px; top: 56px; display: flex; flex-direction: column; gap: 6px">
    <span style="font-size: 44px; font-weight: 700; letter-spacing: -0.05em; line-height: 1">Catch</span>
    <span style="font-size: 15px; font-weight: 600; color: #3A3A3C">Il manque quelqu’un ? C’est toi.</span>
  </div>

  <section aria-label="Créer ton compte" style="position: absolute; left: 0; right: 0; top: 196px; bottom: 0; border-radius: 34px 34px 0 0; background: rgba(242,242,247,0.86); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border-top: 1px solid rgba(255,255,255,0.7); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 -10px 30px rgba(0,0,0,0.14); padding: 24px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
    <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.02em">Créer ton compte</h1>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <button type="button" style="height: 50px; border-radius: 25px; border: none; background: #1C1C1E; color: #FFFFFF; font: 600 15px Inter, sans-serif">Avec Apple</button>
      <button type="button" style="height: 50px; border-radius: 25px; background: rgba(255,255,255,0.75); border: 1px solid rgba(60,60,67,0.18); color: #1C1C1E; font: 600 15px Inter, sans-serif">Avec Google</button>
    </div>

    <div aria-hidden="true" style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #4A4A50"><span style="flex: 1; height: 1px; background: rgba(60,60,67,0.18)"></span>ou avec ton e-mail<span style="flex: 1; height: 1px; background: rgba(60,60,67,0.18)"></span></div>

    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="prenom" style="font-size: 13px; font-weight: 600; color: #3A3A3C">Prénom</label>
      <input id="prenom" type="text" placeholder="Ton prénom" style="height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(60,60,67,0.18); background: rgba(255,255,255,0.85); font: 400 16px Inter, sans-serif; color: #1C1C1E; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="email" style="font-size: 13px; font-weight: 600; color: #3A3A3C">E-mail</label>
      <input id="email" type="email" placeholder="toi@exemple.be" style="height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(60,60,67,0.18); background: rgba(255,255,255,0.85); font: 400 16px Inter, sans-serif; color: #1C1C1E; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <label for="naissance" style="font-size: 13px; font-weight: 600; color: #3A3A3C">Date de naissance · 18 ans minimum</label>
      <input id="naissance" type="text" placeholder="JJ/MM/AAAA" style="height: 46px; padding: 0 16px; border-radius: 14px; border: 1px solid rgba(60,60,67,0.18); background: rgba(255,255,255,0.85); font: 400 16px Inter, sans-serif; color: #1C1C1E; box-sizing: border-box">
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span id="genre" style="font-size: 13px; font-weight: 600; color: #3A3A3C">Genre · pour les sessions entre femmes</span>
      <div role="group" aria-labelledby="genre" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
        <sc-for list="{{genres}}" as="g" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{g.pressed}}" onClick="{{g.pick}}" style="{{g.style}} height: 42px; border-radius: 21px; font: 600 14px Inter, sans-serif">{{g.name}}</button>
        </sc-for>
      </div>
    </div>

    <a href="GlassBienvenue.dc.html" style="margin-top: auto; height: 54px; border-radius: 27px; background: {{accent}}; color: {{ink}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4)">Créer mon compte</a>
    <p style="margin: 0; text-align: center; font-size: 13px; color: #4A4A50">En continuant, tu acceptes les conditions. Déjà un compte ? <a href="GlassCarte.dc.html" style="color: #1C1C1E; font-weight: 600">Se connecter</a></p>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#1C1C1E","#0071E3","#30D158"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF5A36';
    const lin = (c) => { const v = c / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const h = accent.replace('#', '');
    const L = 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));
    const ink = (L + 0.05) / 0.064 >= 1.05 / (L + 0.05) ? '#1C1C1E' : '#FFFFFF';
    const st = this.state || {};
    const picked = st.genre ?? 'Femme';
    const on = 'background: #1C1C1E; color: #FFFFFF; border: 1px solid #1C1C1E;';
    const off = 'background: rgba(255,255,255,0.75); color: #1C1C1E; border: 1px solid rgba(60,60,67,0.18);';
    const genres = ['Femme', 'Homme', 'Autre'].map((name) => ({
      name,
      pressed: name === picked ? 'true' : 'false',
      style: name === picked ? on : off,
      pick: () => this.setState({ genre: name })
    }));
    return { accent, ink, genres };
  }
}
</script>
</body>
</html>
