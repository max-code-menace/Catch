<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Catch — Bienvenue</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000000}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #1C1C1E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #DDE3E6; font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #1C1C1E">

  <svg aria-hidden="true" width="390" height="844" viewBox="0 0 390 844" style="position: absolute; left: 0; top: 0">
    <rect width="390" height="844" fill="#DDE3E6"></rect>
    <path d="M-10 170 L120 140 L152 268 L44 314 L-10 296 Z" fill="#B9D3A8"></path>
    <path d="M236 60 L372 36 L400 184 L262 216 Z" fill="#B9D3A8"></path>
    <path d="M150 220 q32 -22 52 10 q20 42 -12 72 q-40 20 -50 -22 q-10 -40 10 -60 Z" fill="#9CC6E0"></path>
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
      <path d="M60 -10 L84 250 M290 -10 L300 200 M-10 120 L200 96 L400 60 M-10 330 L220 290" stroke-width="5"></path>
      <path d="M-10 250 L400 180 M200 -10 L230 300" stroke-width="14"></path>
    </g>
  </svg>

  <div style="position: absolute; left: 24px; right: 24px; top: 72px; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 56px; font-weight: 700; letter-spacing: -0.05em; line-height: 1">Catch</span>
    <span style="align-self: flex-start; padding: 8px 14px; border-radius: 18px; background: rgba(242,242,247,0.66); backdrop-filter: blur(24px) saturate(180%); -webkit-backdrop-filter: blur(24px) saturate(180%); border: 1px solid rgba(255,255,255,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.85); font-size: 17px; font-weight: 600">Il manque quelqu’un ? C’est toi.</span>
  </div>

  <section aria-label="Bienvenue" style="position: absolute; left: 0; right: 0; top: 300px; bottom: 0; border-radius: 34px 34px 0 0; background: rgba(242,242,247,0.80); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); border-top: 1px solid rgba(255,255,255,0.7); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 -10px 30px rgba(0,0,0,0.14); padding: 24px 20px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Tu joues à quoi ?</h1>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{sports}}" as="s" hint-placeholder-count="9">
          <button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.style}} height: 44px; border-radius: 22px; font: 600 14px Inter, sans-serif">{{s.name}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Plutôt quand ?</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{times}}" as="t" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}} height: 44px; border-radius: 22px; font: 600 14px Inter, sans-serif">{{t.name}}</button>
        </sc-for>
      </div>
    </div>
    <p style="margin: 0; font-size: 15px; color: #4A4A50">Ixelles, Bruxelles · trouvé grâce à ta position</p>
    <div style="margin-top: auto; display: flex; flex-direction: column; gap: 8px">
      <a href="GlassCarte.dc.html" style="height: 56px; border-radius: 28px; background: {{accent}}; color: {{ink}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4)">C’est parti</a>
      <span style="text-align: center; font-size: 13px; color: #4A4A50">Pas de compte à créer pour regarder la carte</span>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#1C1C1E","#0071E3","#30D158"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF5A36';
    const lin = (c) => { const v = c / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const h = accent.replace('#', '');
    const L = 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));
    const ink = (L + 0.05) / 0.064 >= 1.05 / (L + 0.05) ? '#1C1C1E' : '#FFFFFF';
    const st = this.state || {};
    const pickedSports = st.sports ?? ['Spikeball', 'Foot'];
    const pickedTimes = st.times ?? ['Après 18 h'];
    const on = 'background: #1C1C1E; color: #FFFFFF; border: 1px solid #1C1C1E;';
    const off = 'background: rgba(255,255,255,0.7); color: #1C1C1E; border: 1px solid rgba(255,255,255,0.8); box-shadow: inset 0 1px 0 rgba(255,255,255,0.9);';
    const toggle = (list, name) => list.includes(name) ? list.filter((x) => x !== name) : list.concat([name]);
    const sports = ['Spikeball', 'Foot', 'Basket', 'Volley', 'Course', 'Pétanque', 'Padel', 'Frisbee', 'Ping-pong'].map((name) => ({
      name,
      pressed: pickedSports.includes(name) ? 'true' : 'false',
      style: pickedSports.includes(name) ? on : off,
      pick: () => this.setState({ sports: toggle(pickedSports, name) })
    }));
    const times = ['Midi', 'Après 18 h', 'Week-end'].map((name) => ({
      name,
      pressed: pickedTimes.includes(name) ? 'true' : 'false',
      style: pickedTimes.includes(name) ? on : off,
      pick: () => this.setState({ times: toggle(pickedTimes, name) })
    }));
    return { accent, ink, sports, times };
  }
}
</script>
</body>
</html>
