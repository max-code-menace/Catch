<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Catch — Après la partie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:#1C1C1E}a:hover{color:#000000}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #1C1C1E;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E9ECEF; font-family: Inter, system-ui, sans-serif; font-variant-numeric: tabular-nums; color: #1C1C1E; padding: 24px 16px 28px; box-sizing: border-box; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; justify-content: space-between; align-items: flex-start; padding: 0 4px">
    <div>
      <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.03em">Bien joué !</h1>
      <p style="margin: 4px 0 0; font-size: 15px; color: #4A4A50">Spikeball · Parc du Cinquantenaire · 1 h 10</p>
    </div>
    <a href="GlassCarte.dc.html" aria-label="Fermer" style="width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95); color: #1C1C1E; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
    </a>
  </div>

  <section style="padding: 16px; border-radius: 26px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95); display: flex; flex-direction: column; gap: 4px">
    <h2 style="margin: 0 0 6px; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #4A4A50">TU AS JOUÉ AVEC</h2>
    <sc-for list="{{players}}" as="p" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px">
        <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 20px; background: #1C1C1E; color: #FFFFFF; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center">{{p.initial}}</span>
        <span style="flex: 1; font-size: 16px; font-weight: 600">{{p.name}}</span>
        <button type="button" aria-pressed="{{p.pressed}}" onClick="{{p.toggle}}" style="{{p.style}} height: 40px; padding: 0 16px; border-radius: 20px; font: 700 14px Inter, sans-serif">{{p.label}}</button>
      </div>
    </sc-for>
  </section>

  <section style="padding: 16px; border-radius: 26px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95); display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <h2 style="margin: 0; font-size: 20px; font-weight: 700">3 semaines d’affilée</h2>
      <span style="font-size: 14px; color: #4A4A50">ta série</span>
    </div>
    <div aria-hidden="true" style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 6px">
      <span style="height: 10px; border-radius: 5px; background: rgba(120,120,128,0.2)"></span>
      <span style="height: 10px; border-radius: 5px; background: rgba(120,120,128,0.2)"></span>
      <span style="height: 10px; border-radius: 5px; background: rgba(120,120,128,0.2)"></span>
      <span style="height: 10px; border-radius: 5px; background: rgba(120,120,128,0.2)"></span>
      <span style="height: 10px; border-radius: 5px; background: rgba(120,120,128,0.2)"></span>
      <span style="height: 10px; border-radius: 5px; background: #1C1C1E"></span>
      <span style="height: 10px; border-radius: 5px; background: #1C1C1E"></span>
      <span style="height: 10px; border-radius: 5px; background: #1C1C1E"></span>
    </div>
    <p style="margin: 0; font-size: 14px; color: #4A4A50">Une partie par semaine suffit pour garder ta série.</p>
  </section>

  <section style="padding: 16px; border-radius: 26px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95); display: flex; flex-direction: column; gap: 12px">
    <h2 style="margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: #4A4A50">ON REMET ÇA ?</h2>
    <p style="margin: 0; font-size: 17px; font-weight: 600; line-height: 1.35">Léa organise un spikeball jeudi à 18:30, au même endroit.</p>
    <a href="GlassPartie.dc.html" style="height: 52px; border-radius: 26px; background: {{accent}}; color: {{ink}}; font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4)">Catch</a>
  </section>

  <a href="GlassMessages.dc.html" style="margin-top: auto; height: 48px; border-radius: 24px; background: rgba(255,255,255,0.7); border: 1px solid rgba(255,255,255,0.85); box-shadow: inset 0 1px 0 rgba(255,255,255,0.95); color: #1C1C1E; font-size: 15px; font-weight: 600; display: flex; align-items: center; justify-content: center; text-decoration: none">Voir mes rencontres</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#FF5A36","options":["#FF5A36","#1C1C1E","#0071E3","#30D158"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#FF5A36';
    const lin = (c) => { const v = c / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
    const h = accent.replace('#', '');
    const L = 0.2126 * lin(parseInt(h.slice(0, 2), 16)) + 0.7152 * lin(parseInt(h.slice(2, 4), 16)) + 0.0722 * lin(parseInt(h.slice(4, 6), 16));
    const ink = (L + 0.05) / 0.064 >= 1.05 / (L + 0.05) ? '#1C1C1E' : '#FFFFFF';
    const st = this.state || {};
    const gg = st.gg ?? { 'Léa': true };
    const on = 'background: #1C1C1E; color: #FFFFFF; border: 1px solid #1C1C1E;';
    const off = 'background: rgba(255,255,255,0.8); color: #1C1C1E; border: 1px solid rgba(60,60,67,0.18);';
    const players = [['Léa', 'L'], ['Sam', 'S'], ['Tom', 'T']].map(([name, initial]) => ({
      name,
      initial,
      pressed: gg[name] ? 'true' : 'false',
      label: gg[name] ? 'GG envoyé' : 'GG',
      style: gg[name] ? on : off,
      toggle: () => this.setState({ gg: Object.assign({}, gg, { [name]: !gg[name] }) })
    }));
    return { accent, ink, players };
  }
}
</script>
</body>
</html>
