<div style="margin:0;padding:32px 16px;background-color:#FBF8F5;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;margin:0 auto;">
    <tr>
      <td style="padding:0 8px 20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:26px;font-weight:800;letter-spacing:-0.5px;color:#C8361C;">
        catch
      </td>
    </tr>
    <tr>
      <td style="padding:32px 28px;background-color:#FFFFFF;border:1px solid #E8DFD7;border-radius:20px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1C1412;">
        <div style="width:28px;height:28px;border-radius:14px;background-color:#E35A0C;margin-bottom:20px;"></div>
        <h1 style="margin:0 0 8px;font-size:26px;line-height:32px;font-weight:800;letter-spacing:-0.5px;color:#1C1412;">
          Bienvenue sur Catch
        </h1>
        <p style="margin:0 0 24px;font-size:16px;line-height:24px;color:#6E625C;">
          Voici ton code. Entre-le dans l'app pour créer ton compte et catcher ta première session.
        </p>
        <div style="padding:20px 12px;background-color:#FCE6E0;border-radius:16px;text-align:center;font-size:36px;line-height:40px;font-weight:800;letter-spacing:8px;color:#A12A14;">
          {{ .Token }}
        </div>
        <p style="margin:24px 0 0;font-size:14px;line-height:22px;color:#6E625C;">
          Le code ne marche qu'une fois et expire vite. Tu n'as rien demandé ? Ignore cet e-mail, il ne se passera rien.
        </p>
      </td>
    </tr>
    <tr>
      <td style="padding:20px 8px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:20px;color:#6E625C;">
        Catch · Du sport et du monde, près de chez toi.
      </td>
    </tr>
  </table>
</div>
